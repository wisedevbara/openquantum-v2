# OpenQuantum V2 — Nginx reverse proxy configuration
# Production: proxy ke app-prod container (port 3000), TLS via certbot/letsencrypt.

events {
    worker_connections 1024;
}

http {
    # --- Performance: gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # --- Security headers (applied globally to all sites) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    upstream openquantum_app {
        server app-prod:3000;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name openquantum.id www.openquantum.id;

        # Tambahkan certbot HTTP-01 challenge endpoint (non-https)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name openquantum.id www.openquantum.id;

        ssl_certificate /etc/letsencrypt/live/openquantum.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/openquantum.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;

        # Static assets cache (Next.js hashed chunks)
        location /_next/static/ {
            proxy_pass http://app-prod;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public assets
        location /models/ {
            proxy_pass http://app-prod;
            add_header Cache-Control "public, max-age=86400";
        }

        # Everything else → Next.js app
        location / {
            proxy_pass http://app-prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}